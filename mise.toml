[tasks.setup]
description = "Install Python and web dependencies"
run = ["uv sync --all-extras", "pnpm --dir web install"]

[tasks."dev:api"]
description = "API and job worker on :8000, restarted on Python changes; pages redirect to the web UI on :5173"
run = "uv run python scripts/dev_api.py"
env = { MINIBRAIN_HOME = "{{config_root}}/.minibrain", MINIBRAIN_UI_URL = "http://localhost:5173", MINIBRAIN_POLICY_SESSION_IDLE_MINUTES = "0" }

[tasks."dev:web"]
description = "Web UI with hot reload on :5173"
dir = "{{config_root}}/web"
run = "exec node scripts/dev.mjs"

[tasks.dev]
description = "API, worker and web UI with hot reload"
depends = ["dev:api", "dev:web"]

[tasks.setup-link]
description = "Print a fresh one-time link to create the first admin of the dev install in .minibrain/"
run = "uv run minibrain admin setup-link --url http://localhost:5173"
env = { MINIBRAIN_HOME = "{{config_root}}/.minibrain" }

[tasks.serve]
description = "API, worker and the built UI on :8000, data in .minibrain/"
run = ["pnpm --dir web build", "uv run minibrain serve"]
env = { MINIBRAIN_HOME = "{{config_root}}/.minibrain" }

[tasks.build]
description = "Wheel with the built UI inside, in dist/"
run = "uv build --wheel"

[tasks.sbom]
description = "CycloneDX SBOMs of the Python and web dependency sets in sbom/, as CI makes them; the web one needs syft"
run = [
    "uv export --quiet --frozen --no-dev --all-extras --format cyclonedx1.5 --preview-features sbom-export -o sbom/minibrain-python.cdx.json",
    "syft scan file:web/pnpm-lock.yaml --quiet --source-name minibrain-web -o cyclonedx-json@1.6=sbom/minibrain-web.cdx.json",
]
env = { SYFT_CHECK_FOR_APP_UPDATE = "false" }

[tasks.api-types]
description = "Regenerate the TypeScript API client from FastAPI"
run = "pnpm --dir web gen:api"

[tasks.test]
description = "Backend tests"
run = "uv run pytest -q"

[tasks.check]
description = "Tests, lint, format, crypto rules, product inventory and type checks for backend and web; CI runs the same"
run = [
    "uv run pytest -q",
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run python scripts/check_crypto.py",
    "uv run python scripts/check_product.py",
    "uv run pyright",
    "shellcheck install.sh scripts/*.sh",
    "pnpm --dir web lint",
    "pnpm --dir web typecheck",
]
