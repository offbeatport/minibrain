name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  NODE_VERSION: "24"
  SYFT_VERSION: "1.54.1"
  SYFT_SHA256: "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Crypto rules
        run: uv run python scripts/check_crypto.py
      - name: Pyright
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  package:
    name: Wheel and sdist
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the sdist and the wheel with the UI
        run: uv build
      - name: Check the wheel and the sdist carry the UI
        run: |
          unzip -l dist/minibrain-*.whl | grep -q "minibrain/web/index.html"
          tar -tzf dist/minibrain-*.tar.gz | grep -q "/web/dist/index.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minibrain-wheel
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minibrain-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Python SBOM from uv.lock
        run: >-
          uv export --quiet --frozen --no-dev --all-extras --format cyclonedx1.5 --preview-features sbom-export
          -o sbom/minibrain-python.cdx.json
      - name: Install syft
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}" syft
      - name: Web SBOM from pnpm-lock.yaml
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: >-
          "${RUNNER_TEMP}/syft" scan file:web/pnpm-lock.yaml --quiet
          --source-name minibrain-web --source-version "${GITHUB_SHA}"
          -o cyclonedx-json@1.6=sbom/minibrain-web.cdx.json
      - name: Check the SBOMs list the dependencies
        run: |
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5" and (.components | length) > 50' sbom/minibrain-python.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length) > 50' sbom/minibrain-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minibrain-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
