name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/offbeatport/minibrain

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches pyproject.toml
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          publish=false
          if [ "${EVENT}" = push ]; then
            if [ "${REF_TYPE}" != tag ] || [ "${REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${REF_NAME} does not match version ${version} in pyproject.toml: expected v${version}"
              exit 1
            fi
            publish=true
          fi
          prerelease=false
          if [[ "${version}" =~ (a|b|rc|\.dev)[0-9]+ ]]; then
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${publish}" = true ]; then
            echo "Releasing ${version} (prerelease: ${prerelease})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Dry run of ${version}: builds everything, publishes nothing" >> "${GITHUB_STEP_SUMMARY}"
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Image ${{ matrix.variant }} ${{ matrix.arch }}
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [cpu, cuda]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minibrain-wheel
          path: ${{ runner.temp }}/wheel
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          build-contexts: wheel=${{ runner.temp }}/wheel
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.version.outputs.publish }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Disk use
        if: always()
        run: df -h /

  image-tags:
    name: Image tags
    needs: [version, images]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      cpu-digest: ${{ steps.tags.outputs.cpu-digest }}
      cuda-digest: ${{ steps.tags.outputs.cuda-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch images
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag_variant() {
            local variant=$1 tag=$2 floating=$3
            local args=(--tag "${IMAGE}:${tag}")
            if [ "${PRERELEASE}" = false ]; then
              args+=(--tag "${IMAGE}:${floating}")
            fi
            args+=(
              --annotation "index:org.opencontainers.image.title=minibrain"
              --annotation "index:org.opencontainers.image.description=Private platform for small, task-specific models"
              --annotation "index:org.opencontainers.image.licenses=Apache-2.0"
              --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
              --annotation "index:org.opencontainers.image.version=${VERSION}"
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
            )
            for digest in "${RUNNER_TEMP}/digests/digest-${variant}-"*/*; do
              args+=("${IMAGE}@sha256:$(basename "${digest}")")
            done
            docker buildx imagetools create "${args[@]}"
            digest=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)
            echo "${variant}-digest=${digest}" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE}:${tag}@${digest}" >> "${GITHUB_STEP_SUMMARY}"
          }
          tag_variant cpu "${VERSION}" latest
          tag_variant cuda "${VERSION}-cuda" cuda

  assets:
    name: Release assets
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: minibrain-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Check the files and write SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for file in "minibrain-${VERSION}-py3-none-any.whl" "minibrain-${VERSION}.tar.gz" minibrain-python.cdx.json minibrain-web.cdx.json; do
            if [ ! -f "${file}" ]; then
              echo "::error::${file} is missing from the CI artifacts"
              exit 1
            fi
          done
          sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from Conventional Commits
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/notes"
          python3 scripts/release_notes.py --version "${VERSION}" --ref "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --image "${IMAGE}" > "${RUNNER_TEMP}/notes/notes.md"
          cat "${RUNNER_TEMP}/notes/notes.md" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, assets, image-tags]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "${TAG}" "${RUNNER_TEMP}"/assets/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "minibrain ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes/notes.md" --prerelease="${PRERELEASE}"
