[project]
name = "minibrain"
version = "0.0.0"
description = "Private platform for small, task-specific models"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "datasets",
    "fastapi",
    "peft",
    "torch",
    "transformers",
    "trl",
    "uvicorn",
]

[dependency-groups]
dev = [
    "openai",
    "pyright",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.pyright]
include = ["spikes"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["spikes"]
