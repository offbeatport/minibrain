[project]
name = "minibrain"
version = "0.1.0"
description = "Private platform for small, task-specific models"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate",
    "alembic>=1.20.1",
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "datasets",
    "duckdb>=2.0.0",
    "fastapi",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "peft",
    "python-multipart>=0.0.32",
    "s3fs>=2026.7.0",
    "sqlalchemy>=2.1.6",
    "torch",
    "transformers",
    "trl",
    "uvicorn",
]

[project.scripts]
minibrain = "minibrain.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
mlx = [
    "mlx-lm>=0.32.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
llamacpp = [
    "llama-cpp-python>=0.3.36",
]
qlora = [
    "bitsandbytes>=0.50.2 ; sys_platform == 'linux' or sys_platform == 'win32'",
]
hsm = [
    "pykcs11>=1.5.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minibrain"]

[tool.hatch.build.targets.wheel.force-include]
"samples/demo_travel_intents.jsonl" = "minibrain/samples/demo_travel_intents.jsonl"
"samples/demo_banking77.csv" = "minibrain/samples/demo_banking77.csv"
"samples/demo_clinc150.parquet" = "minibrain/samples/demo_clinc150.parquet"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "deltalake>=1.6.6",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "hatchling>=1.33.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "moto[s3]>=5.2.5",
    "openai",
    "pyright",
    "pytest",
    "ruff",
    "watchfiles>=1.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "S105", "S106", "S608"]
"tests/fake_s3.py" = ["S105"]
"tests/test_model_health.py" = ["F401", "F811"]
"minibrain/worker.py" = ["S603"]
"minibrain/cli.py" = ["S603"]
"minibrain/supervise.py" = ["S603"]
"minibrain/ml/train.py" = ["S606"]
"minibrain/data/sources.py" = ["S608"]
"minibrain/data/remote.py" = ["S608"]
"minibrain/data/delta.py" = ["S608"]
"hatch_build.py" = ["S603"]
"scripts/release_notes.py" = ["S603"]

[tool.pyright]
include = ["minibrain", "samples", "scripts", "tests", "hatch_build.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "minibrain/serve/mlx_backend.py"
extraPaths = ["."]
reportMissingImports = "warning"

[[tool.pyright.executionEnvironments]]
root = "minibrain/serve/llamacpp_backend.py"
extraPaths = ["."]
reportMissingImports = "warning"

[[tool.pyright.executionEnvironments]]
root = "tests/test_engines.py"
extraPaths = ["."]
reportMissingImports = "warning"

[[tool.pyright.executionEnvironments]]
root = "minibrain/encryption/hsm.py"
extraPaths = ["."]
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
