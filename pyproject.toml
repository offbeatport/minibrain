[project]
name = "minibrain"
version = "0.0.0"
description = "Private platform for small, task-specific models"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "datasets",
    "duckdb>=2.0.0",
    "fastapi",
    "huey>=3.5.3",
    "peft",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "torch",
    "transformers",
    "trl",
    "uvicorn",
]

[project.scripts]
minibrain = "minibrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minibrain"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openai",
    "pyright",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]
"minibrain/worker.py" = ["S603"]
"minibrain/cli.py" = ["S603"]
"minibrain/data/sources.py" = ["S608"]

[tool.pyright]
include = ["minibrain", "spikes", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
